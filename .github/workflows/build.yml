name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (csc из .NET Framework)
        shell: cmd
        run: call build.cmd

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path bin\BatteryTray.exe
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList '--preview', "$PWD\preview" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "preview exit code $($p.ExitCode)" }
          Get-ChildItem preview
          Get-Content "$env:LOCALAPPDATA\BatteryTray\BatteryTray.log"
          # на раннере нет Bluetooth, поэтому ошибки опроса BT не считаем; падения и ошибки рендера считаем
          if (Select-String -Path "$env:LOCALAPPDATA\BatteryTray\BatteryTray.log" -Pattern 'selftest error|preview error|paint error|fatal:|UI exception|task exception' -Quiet) { throw "errors in log" }

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryTray
          path: |
            bin/BatteryTray.exe
            preview/*.png

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item bin\BatteryTray.exe, README.md, LICENSE, CHANGELOG.md dist\
          Compress-Archive -Path dist\* -DestinationPath "BatteryTray-${{ github.ref_name }}.zip"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BatteryTray ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            BatteryTray-${{ github.ref_name }}.zip
            bin/BatteryTray.exe
